schemaVersion: 1
id: hanako-gallery
name: Hanako Gallery
publisher: Yuexiye
author: Yuexiye
version: 0.5.0
description: >-
  Image gallery for HanaAgent. Import local directories, build an EXIF index,
  tag and thumbnail, search full-text, and copy Markdown references. Images stay
  where they are; only the index and thumbnails are stored.
license: AGPL-3.0
categories:
  - Design
  - Media
keywords:
  - gallery
  - image
  - photos
  - exif
  - thumbnail
  - tag
  - search
homepage: https://github.com/Yuexiye/OH-Plugins
repository: https://github.com/Yuexiye/OH-Plugins
readmePath: official-plugins/hanako-gallery/README.md
source:
  kind: official-source
  path: official-plugins/hanako-gallery
compatibility:
  minAppVersion: 0.928.0
trust: full-access
permissions:
  - Scans user-chosen image directories and reads file metadata
  - Reads photo EXIF data such as capture time and camera model
  - Generates and caches thumbnails in the plugin data directory
  - Indexes images into a local SQLite database stored in app data
  - Reads host-bundled assets and the AI media library in read-only mode
  - Runs a managed native service process on localhost
contributions:
  - tools
  - routes
  - page
distribution:
  kind: release
  packageUrl: https://github.com/Yuexiye/OH-Plugins/releases/download/hanako-gallery-v0.5.0/hanako-gallery.zip
  sha256: 5911fd8f8d1fe14ecb68bebc211c9c9635c8b7fd064a572ba22391509317c72b
install:
  defaultEnabled: false
